

version: '3'

services:
  synapse:
    build:
      context: .
      dockerfile: docker/Dockerfile-s3
    image: synapse-with-s3:latest
    container_name: synapse
    restart: unless-stopped
    volumes:
      - ./data:/data:rw
      - ./docker/conf:/conf:ro
    ports:
      - 8008:8008
    environment:
      SYNAPSE_CONFIG_PATH: /conf/homeserver-s3.yaml
    # Uncomment if you need to generate a new config
    # entrypoint: ["/start.py", "generate", "--config-path", "/conf/homeserver-s3.yaml"]

  # If you still want to use local PostgreSQL, uncomment this:
  # db:
